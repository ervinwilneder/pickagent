<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>belo · agente</title>
</head>
<body>
  <main class="pantalla">
    <header class="barra">
      <span class="marca-belo">belo<sup>®</sup> <span class="apagado">/ agente</span></span>
      <span class="centro apagado" id="servidor">conectando con belo</span>
      <span class="estado" id="estado">iniciando</span>
    </header>
    <section class="hilo" id="mensajes" aria-live="polite"></section>
    <form class="composer" id="composer">
      <span class="prompt-mark">$</span>
      <input id="texto" type="text" placeholder="escribile al agente" autocomplete="off">
      <button class="boton primario" id="enviar" type="submit">Enviar ↵</button>
    </form>
    <footer class="pie"><span>hilo://<b>principal</b></span><span>evento://<b>movimiento.nuevo</b></span><span>mcp://<b>apps + events</b></span></footer>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
