<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#05060f">
  <title>pickagent</title>
</head>
<body>
  <a class="salto" href="#texto">Ir al mensaje</a>
  <main class="pantalla">
    <header class="barra">
      <a class="marca-belo" href="/">pickagent</a>
    </header>
    <section class="hilo" id="mensajes" aria-label="Conversación" aria-live="polite"></section>
    <div class="zona-composer">
      <form class="composer" id="composer" aria-label="Escribir un mensaje">
        <label class="sr-only" for="texto">Tu mensaje</label>
        <textarea id="texto" rows="4" placeholder="¿Qué querés mandar?" autocomplete="off" aria-describedby="ayuda-mensaje"></textarea>
        <button class="boton primario" id="enviar" type="submit">Enviar <span data-icono="arrow-up" aria-hidden="true"></span></button>
      </form>
      <p class="error-mensaje" id="error-mensaje" role="alert" hidden></p>
      <p class="ayuda-mensaje" id="ayuda-mensaje">Los pagos requieren tu aprobación.</p>
    </div>
    <footer class="pie"><span>transportistas <b>agregados</b> · pagos <b>con belo</b></span></footer>
  </main>
  <template id="bienvenida-template">
    <div class="bienvenida">
      <h1>Contá qué querés mandar.</h1>
      <p>De dónde a dónde, qué llevás y para cuándo.<br>El agente te ayuda a encontrar el envío.</p>
      <div class="ejemplos" role="group" aria-label="Ejemplos para empezar">
        <button type="button" data-ejemplo="Quiero mandar mercadería a ">Quiero mandar mercadería a... <span data-icono="arrow-up-right" aria-hidden="true"></span></button>
        <button type="button" data-ejemplo="Compará opciones de envío">Compará opciones de envío... <span data-icono="arrow-up-right" aria-hidden="true"></span></button>
      </div>
    </div>
  </template>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
